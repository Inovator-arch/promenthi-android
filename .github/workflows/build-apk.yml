name: Build Promenthi Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack Promenthi project
        run: |
          unzip -q PromenthiAndroid_ZeroCostLaunch.zip
          test -f PromenthiAndroid/app/build.gradle.kts
      - name: Align Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('PromenthiAndroid/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('JavaVersion.VERSION_1_8', 'JavaVersion.VERSION_17')
          s = s.replace('JavaVersion.VERSION_8', 'JavaVersion.VERSION_17')
          s = re.sub(r'jvmTarget\\s*=\\s*[\"\\']1\\.8[\"\\']', 'jvmTarget = \"17\"', s)
          p.write_text(s)
          print('Updated app/build.gradle.kts Java compatibility to 17')
          print(p.read_text())
          PY
      - name: Build debug APK
        run: gradle --no-daemon -p PromenthiAndroid assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Promenthi-debug-APK
          path: PromenthiAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
