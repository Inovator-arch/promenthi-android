name: Build Promenthi Web App APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'PromenthiWebView/**'
      - '.github/workflows/build-webview-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon -p PromenthiWebView assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Promenthi-Android-APK
          path: PromenthiWebView/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
